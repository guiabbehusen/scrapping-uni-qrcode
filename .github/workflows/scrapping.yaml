name: Scrapping uni login

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: Executar o Robô
        env:
          RA_ESPACO_ALUNO: ${{ secrets.RA_ESPACO_ALUNO }}
          SENHA_ESPACO_ALUNO: ${{ secrets.SENHA_ESPACO_ALUNO }}
        run: python scrapping-uni-qrcode.py

      - name: Resgatar Imagens Geradas
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: Resultados-Robo
          path: |
            resultado.png
            imagem_convertida.jpg