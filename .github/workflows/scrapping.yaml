name: Scrapping UNI QRCode

on:
  workflow_dispatch:
  schedule:
    - cron: '13 10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: scrapping-uni-qrcode
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: Executar o Robô
        env:
          RA_ESPACO_ALUNO: ${{ secrets.RA_ESPACO_ALUNO }}
          SENHA_ESPACO_ALUNO: ${{ secrets.SENHA_ESPACO_ALUNO }}
        run: |
          rm -f imagem_convertida.jpg
          python scrapping-uni-qrcode.py
          if [ ! -s imagem_convertida.jpg ]; then
            echo "::error::O robô não gerou uma imagem nova do QR Code."
            exit 1
          fi

      - name: Salvar prints (Artefatos)
        uses: actions/upload-artifact@v4
        if: always() # Garante que vai salvar a foto mesmo se algo der errado antes
        with:
          name: imagens-debug
          path: "*.png"
          if-no-files-found: ignore

      - name: Baixar o Armazenamento Privado
        uses: actions/checkout@v4
        with:
          repository: guiabbehusen/imagem-qrcode-ceub
          token: ${{ secrets.KEY_GITHUB }}
          ref: main
          path: privado

      - name: Mover a foto e salvar no Cofre
        run: |
          test -s imagem_convertida.jpg
          cp imagem_convertida.jpg privado/
          cd privado
          git config user.name "QR Bot"
          git config user.email "robo@github.com"
          git add imagem_convertida.jpg
          if git diff --cached --quiet; then
            echo "QR Code coletado nesta execução; a imagem é idêntica à do repositório privado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Atualiza QR Code diário no Cofre"
          git push origin HEAD:main
          echo "QR Code coletado nesta execução e atualizado no repositório privado." >> "$GITHUB_STEP_SUMMARY"
