name: Scrapping UNI QRCode

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1-5'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: Executar o Robô
        env:
          RA_ESPACO_ALUNO: ${{ secrets.RA_ESPACO_ALUNO }}
          SENHA_ESPACO_ALUNO: ${{ secrets.SENHA_ESPACO_ALUNO }}
        run: python scrapping-uni-qrcode.py

      - name: Baixar o Armazenamento Privado
        uses: actions/checkout@v4
        with:
          repository: guiabbehusen/imagem-qrcode-ceub
          token: ${{ secrets.KEY_GITHUB }}
          path: privado

      - name: Mover a foto e salvar no Cofre
        run: |
          cp imagem_convertida.jpg privado/
          cd privado
          git config user.name "QR Bot"
          git config user.email "robo@github.com"
          git add imagem_convertida.jpg
          git commit -m "Atualiza QR Code diário no Cofre" || echo "Sem mudanças"
          git push
